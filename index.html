<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manga → PDF &amp; Reader</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:#0f1115;color:#e6e8ee;font:15px/1.7 -apple-system,"Segoe UI","Noto Sans","Microsoft YaHei",sans-serif;padding:24px}
.box{max-width:560px;width:100%;background:#171a21;border:1px solid #242938;border-radius:14px;padding:26px 24px}
h1{margin:0 0 6px;font-size:20px}
p{margin:0 0 14px;color:#9aa3b8;font-size:13.5px}
a.go{display:block;text-align:center;background:#4f7cff;color:#fff;text-decoration:none;
 border-radius:10px;padding:14px;font-size:15px;font-weight:600}
a.go:hover{background:#3f6ae8}
.status{margin-top:12px;font-size:12.5px;color:#6b7488;text-align:center;min-height:20px}
.hint{margin-top:16px;padding-top:14px;border-top:1px solid #222734;font-size:12.5px;color:#6b7488}
code{background:#0f1115;padding:1px 5px;border-radius:4px;font-size:12px}
</style></head>
<body><div class="box">
  <h1>Manga → PDF &amp; Reader</h1>
  <p>Opening the app…</p>
  <a class="go" id="go" href="#">Open the app</a>
  <div class="status" id="status"></div>
  <div class="hint">
    This page is only a launcher: GitHub Pages is static and HTTPS-only, so the application
    (Python + downloaders + PDF pipeline) runs elsewhere and is published through a tunnel.
  </div>
</div>
<script>
(function () {
  var REPO = "miaoyhcat/eh-pdf-web";
  var FALLBACK = "https://individuals-cage-rhythm-foster.trycloudflare.com/";
  var statusEl = document.getElementById("status");
  var goEl = document.getElementById("go");

  function setStatus(t) { statusEl.textContent = t; }
  function open(u) {
    if (!u || u.indexOf("https://") !== 0) return false;
    goEl.href = u;
    setStatus("Redirecting…");
    location.replace(u);
    return true;
  }

  // 1) GitHub API: never CDN-cached, so a tunnel change is visible within seconds
  function viaApi() {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/current.txt",
                 {cache: "no-store", headers: {"Accept": "application/vnd.github.raw"}})
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) { return t.trim(); })
      .catch(function () { return ""; });
  }
  // 2) same-origin file (CDN cached up to ~10 min)
  function viaFile() {
    return fetch("current.txt?t=" + Date.now(), {cache: "no-store"})
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (t) { return t.trim(); })
      .catch(function () { return ""; });
  }

  setStatus("Looking up the current address…");
  viaApi()
    .then(function (u) { return open(u) ? null : viaFile(); })
    .then(function (u) { if (u) open(u); })
    .catch(function () {})
    .finally(function () {
      if (!open._done) {
        setTimeout(function () {
          if (!goEl.href || goEl.href.indexOf("https://") !== 0) open(FALLBACK);
        }, 2500);
      }
    });

  goEl.addEventListener("click", function (e) {
    if (goEl.href === "#") { e.preventDefault(); open(FALLBACK); }
  });
})();
</script>
</body></html>
